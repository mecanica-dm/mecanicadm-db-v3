name: DESTROY - Banco de Dados (botão vermelho)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite DESTRUIR para confirmar"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30

    if: inputs.confirmation == 'DESTRUIR'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup do Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="key=terraform/mecanicadm-db/terraform.tfstate"
        env:
          TF_WORKSPACE: prod

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        env:
          TF_WORKSPACE: prod

      - name: Verifica órfãos (informativo)
        if: always()
        run: |
          echo "=== Snapshots do RDS restantes ==="
          aws db describe-db-snapshots \
            --query 'DBSnapshots[].DBSnapshotIdentifier' \
            --output table 2>/dev/null || true
          echo "=== Instâncias RDS restantes ==="
          aws rds describe-db-instances \
            --query 'DBInstances[].DBInstanceIdentifier' \
            --output table 2>/dev/null || true
          echo ">>> Se aparecer algo acima, apague manualmente pelo console."
